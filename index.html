<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#ffffff">

  <title>E-Care | Digital Learning & Student Care Platform</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- FINAL DESIGN IMAGE -->
    <img
      src="assets/final-design.png"
      class="final-design"
      alt="E-Care Digital Learning and Student Care Platform"
    >

    <!-- MENU -->
    <button
      class="click-area menu-area"
      id="menuBtn"
      aria-label="Menu">
    </button>

    <!-- WHATSAPP -->
    <button
      class="click-area whatsapp-area"
      id="whatsappBtn"
      aria-label="Information Send">
    </button>

    <!-- REGISTRATION -->
    <button
      class="click-area registration-area"
      id="registrationBtn"
      aria-label="Registration">
    </button>

    <!-- WEB DEVELOPMENT -->
    <button
      class="click-area course-area course-web"
      data-course="Web Development"
      aria-label="Web Development">
    </button>

    <!-- GRAPHIC DESIGN -->
    <button
      class="click-area course-area course-graphic"
      data-course="Graphic Design"
      aria-label="Graphic Design">
    </button>

    <!-- DIGITAL MARKETING -->
    <button
      class="click-area course-area course-marketing"
      data-course="Digital Marketing"
      aria-label="Digital Marketing">
    </button>

    <!-- VIDEO EDITING -->
    <button
      class="click-area course-area course-video"
      data-course="Video Editing"
      aria-label="Video Editing">
    </button>

  </main>


  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-box">

      <button
        class="modal-close"
        id="modalClose">
        ×
      </button>

      <h2 id="modalTitle">
        E-Care
      </h2>

      <p id="modalMessage">
        Welcome to E-Care.
      </p>

      <button
        class="modal-button"
        id="modalOk">
        OK
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
