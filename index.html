<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#ffffff">

  <title>E-Care Official Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================
       MAIN WEBSITE
       ========================================================= -->

  <main class="page">

    <!-- FINAL DESIGN IMAGE -->
    <img
      src="assets/final-design.png"
      alt="E-Care Official Portal"
      class="final-design"
    >


    <!-- =======================================================
         INVISIBLE CLICK AREAS
         ======================================================= -->

    <!-- MENU -->
    <button
      type="button"
      class="click-area menu-area"
      id="menuButton"
      aria-label="Open Menu"
    ></button>


    <!-- WHATSAPP -->
    <button
      type="button"
      class="click-area whatsapp-area"
      id="whatsappButton"
      aria-label="Contact E-Care on WhatsApp"
    ></button>


    <!-- REGISTRATION -->
    <button
      type="button"
      class="click-area registration-area"
      id="registrationButton"
      aria-label="Registration"
    ></button>


    <!-- WEB DEVELOPMENT -->
    <button
      type="button"
      class="click-area course-area web-area"
      data-course="Web Development"
      aria-label="Web Development"
    ></button>


    <!-- GRAPHIC DESIGN -->
    <button
      type="button"
      class="click-area course-area graphic-area"
      data-course="Graphic Design"
      aria-label="Graphic Design"
    ></button>


    <!-- DIGITAL MARKETING -->
    <button
      type="button"
      class="click-area course-area digital-area"
      data-course="Digital Marketing"
      aria-label="Digital Marketing"
    ></button>


    <!-- VIDEO EDITING -->
    <button
      type="button"
      class="click-area course-area video-area"
      data-course="Video Editing"
      aria-label="Video Editing"
    ></button>

  </main>


  <!-- =========================================================
       MODAL
       ========================================================= -->

  <div
    class="modal-overlay"
    id="modal"
    aria-hidden="true"
  >

    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <!-- CLOSE BUTTON -->
      <button
        type="button"
        class="modal-close"
        id="modalClose"
        aria-label="Close"
      >
        &times;
      </button>


      <!-- MODAL TITLE -->
      <h2 id="modalTitle">
        E-Care
      </h2>


      <!-- IMPORTANT:
           script.js uses modalContent.
           Do not change this ID.
      -->
      <div id="modalContent">

        <p>
          Welcome to E-Care.
        </p>

      </div>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="script.js"></script>

</body>
</html>
